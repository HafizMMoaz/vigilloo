[project]
name = "vigilloo"
version = "0.0.1"
description = "AI-native application security platform"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-php>=0.23",
    "pyyaml>=6.0,<6.1",
]

[project.scripts]
vigilloo = "vigilloo.cli:app"

# Pinned to a single minor each. An open upper bound lets an upstream release turn main
# red with no change in this repo: a ruff minor adds lint rules and reformats, and a mypy
# minor tightens inference. Upgrading is then a deliberate commit that carries whatever
# fixes it needs, which is also what the pinned-lockfile promise in docs/23-dev-guide
# section "Security of Vigilloo itself" means in practice.
[dependency-groups]
dev = [
    "pytest>=9.1,<9.2",
    "mypy>=2.3,<2.4",
    "types-PyYAML>=6.0,<6.1",
    "ruff>=0.16,<0.17",
    "pip-audit>=2.9,<2.10",
    "pre-commit>=4.4,<4.5",
    "hypothesis>=6.145,<6.146",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ IS the vigilloo package - there is no src/vigilloo/ directory. The build maps
# the directory onto the import name, so src/cli.py installs as vigilloo/cli.py.
#
# Two consequences, both load-bearing:
#   1. Imports inside src/ must be relative. There is no vigilloo/ on disk to import.
#   2. Every subpackage must be listed in both tables below. setuptools cannot
#      auto-discover them, because a renaming package-dir does not compose with
#      packages.find. Adding src/foo/ without adding it here builds a wheel that
#      silently omits it. Hatchling was dropped for this layout: it cannot do
#      editable installs when sources renames a prefix.
[tool.setuptools]
package-dir = { "vigilloo" = "src", "vigilloo.laravel" = "src/laravel", "vigilloo.workspace" = "src/workspace", "vigilloo.analysis" = "src/analysis", "vigilloo.report" = "src/report" }
packages = ["vigilloo", "vigilloo.laravel", "vigilloo.workspace", "vigilloo.analysis", "vigilloo.report"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

# isort infers first-party packages by finding a directory of that name. No directory
# is called vigilloo, so without this it sorts `from vigilloo import ...` in the tests
# into the third-party block. Same root cause as the package-dir mapping above.
[tool.ruff.lint.isort]
known-first-party = ["vigilloo"]

# T20 (flake8-print) exists to catch a stray debug print reaching stdout during a scan,
# which would corrupt the report. cli.py and report/terminal.py (the terminal renderer)
# are the exception: they are the terminal report itself, so printing is their job, not
# a bug. The report package's other modules (document, json_report, markdown, etc.) are
# deliberately kept under T20 so a stray print fails CI. scripts/ is a second, narrower
# exception: dump_ast.py and debt.py are standalone dev CLI tools, run directly and
# never imported by src/ or tests/, whose entire documented job (see their docstrings)
# is to print to the terminal - not part of the scan pipeline T20 is guarding.
[tool.ruff.lint.per-file-ignores]
"src/cli.py" = ["T20"]
"src/report/terminal.py" = ["T20"]
"scripts/dump_ast.py" = ["T20"]
"scripts/debt.py" = ["T20"]
"scripts/corpus.py" = ["T20"]

[tool.mypy]
strict = true
# setuptools maps the `src` directory onto the import name `vigilloo` via package-dir, and
# that rename is invisible to mypy: `from vigilloo.baseline import ...` in scripts/ cannot
# be resolved from the source tree. `.mypy-paths/vigilloo` is a symlink to `src` that gives
# mypy the name it expects. Silencing the import instead would type the imported symbol as
# Any, which was verified to let `diff_fingerprints()` with zero arguments pass.
mypy_path = ".mypy-paths"
# scripts/corpus.py computes the NFR-6 precision number that gates the release. A silent
# type error there is a wrong number in a report people trust, so it is checked like src/.
files = ["src", "scripts/corpus.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
