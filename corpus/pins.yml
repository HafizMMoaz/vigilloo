# One entry per enrolled application.
#
# A pin with no recorded rationale cannot be audited. When v1.0 widens the target beyond
# Laravel 9-11, whoever re-pins needs to know why each SHA was chosen.
#
# php_files: find <dir> -name '*.php' -not -path '*/vendor/*' | wc -l
# php_loc:   find <dir> -name '*.php' -not -path '*/vendor/*' -exec cat {} + | wc -l
applications:
  laravel-skeleton:
    repo: https://github.com/laravel/laravel.git
    pin: 3622d746fde67ebaff3dd3fdde3676599434692f
    laravel: "^11.31"
    php: "^8.2"
    licence: MIT
    php_files: 27
    php_loc: 1778
    wave: 1
    pr_subset: true
    rationale: >
      The clean-run control from the parent plan. Small enough to run on every PR, and a
      framework skeleton should produce few or no findings, so a sudden crop of them is a
      strong signal that a rule has become indiscriminate.

  koel:
    repo: https://github.com/koel/koel.git
    pin: 90adda2ad867d7a6b9ac76ac5396d366619b411b
    laravel: "^11.0"
    php: ">=8.2"
    licence: MIT
    php_files: 920
    php_loc: 45088
    wave: 1
    pr_subset: false
    rationale: >
      Music streaming server built with Laravel. Medium-sized real-world application
      with rich audio processing jobs, REST APIs, events, and custom service providers.
      Last commit on Laravel 11 before upgrading to Laravel 12.

  monica:
    repo: https://github.com/monicahq/monica.git
    pin: 64d143317096fd3ceaeef16773055bb9a16a070e
    laravel: "^11.0"
    php: "^8.3"
    licence: AGPL-3.0
    php_files: 1573
    php_loc: 123263
    wave: 1
    pr_subset: false
    rationale: >
      Large personal CRM application. Last commit on Laravel 11 before upgrading
      to Laravel 12. Covers complex domain models, API routes, blade templates,
      and background jobs.
