name: Nightly Performance Benchmarks

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Run NFR Performance Benchmarks
        run: uv run pytest tests/perf --benchmark-enable -v
